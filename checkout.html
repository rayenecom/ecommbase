<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0a0a'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' font-size='40' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/products.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <title>Commande — BASE</title>
  <meta name="robots" content="noindex">
</head>
<body data-page="checkout">
  <div id="site-header"></div>
  <main class="container">
    <div class="checkout" id="checkout">
      <form id="checkout-form" novalidate>
        <h2>Tes coordonnées</h2>
        <div class="form-grid">
          <div class="field"><label for="f-first">Prénom *</label><input id="f-first" name="firstname" autocomplete="given-name" required></div>
          <div class="field"><label for="f-last">Nom *</label><input id="f-last" name="lastname" autocomplete="family-name" required></div>
          <div class="field"><label for="f-phone">Téléphone *</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" required></div>
          <div class="field"><label for="f-email">E-mail *</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
        </div>
        <h2 style="margin-top:32px">Adresse de livraison</h2>
        <div class="form-grid">
          <div class="field full"><label for="f-address">Adresse *</label><input id="f-address" name="address" autocomplete="street-address" required></div>
          <div class="field"><label for="f-zip">Code postal *</label><input id="f-zip" name="zip" autocomplete="postal-code" required></div>
          <div class="field"><label for="f-city">Ville *</label><input id="f-city" name="city" autocomplete="address-level2" required></div>
          <div class="field full"><label for="f-country">Pays</label>
            <select id="f-country" name="country"><option>France</option><option>Belgique</option><option>Suisse</option><option>Luxembourg</option><option>Autre (à préciser en note)</option></select>
          </div>
          <div class="field full"><label for="f-notes">Note (optionnel)</label><textarea id="f-notes" name="notes" placeholder="Une précision sur ta commande ?"></textarea></div>
        </div>

        <h2 style="margin-top:32px">Envoyer ma commande via</h2>
        <div class="pay-options">
          <label class="pay-option"><input type="radio" name="channel" value="whatsapp"><span>WhatsApp<small>Ta commande est envoyée sur WhatsApp, on te répond avec le lien de paiement.</small></span></label>
          <label class="pay-option"><input type="radio" name="channel" value="instagram"><span>Instagram<small>Ton récapitulatif est copié, colle-le dans nos messages privés.</small></span></label>
          <label class="pay-option"><input type="radio" name="channel" value="email"><span>E-mail<small>Ta commande est envoyée par e-mail.</small></span></label>
        </div>
        <p class="form-error" id="form-error" role="alert" style="margin-top:14px"></p>
        <button class="btn btn--block" type="submit" style="margin-top:12px">Valider ma commande</button>
        <p class="cart-note" style="margin-top:12px">Le paiement (carte, PayPal, virement…) se fait après confirmation de la disponibilité de ta taille.</p>
      </form>
      <aside class="summary" id="summary"></aside>
    </div>

    <div class="success-box" id="checkout-done" hidden>
      <h1>Merci !</h1>
      <p>Commande <strong id="order-ref"></strong> préparée.</p>
      <p id="order-channel-note"></p>
      <a class="btn" id="order-retry" href="#" target="_blank" rel="noopener">Renvoyer le message</a>
      <details style="max-width:560px;text-align:left"><summary style="cursor:pointer">Voir le récapitulatif</summary><pre id="order-msg" style="white-space:pre-wrap;font-family:inherit;font-size:13px;background:var(--bg-soft);padding:16px"></pre></details>
      <a class="link-underline" href="shop.html">Continuer mes achats</a>
    </div>
  </main>
  <div id="site-footer"></div>
</body>
</html>
